inherit_from: ../.rubocop-base.yml

# Rails-generated boilerplate this app doesn't hand-author.
AllCops:
  Exclude:
    - 'db/*schema.rb'
    - 'bin/**/*'
    - 'config/**/*'
    - 'vendor/**/*'

    # archspec's own convention requires this exact capitalized filename
    # (mirrors Gemfile/Rakefile) -- not something we can rename to snake_case.
    - 'Archspec.rb'
