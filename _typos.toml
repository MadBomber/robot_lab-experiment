[files]
# Generated by the asgard quality checks; may quote source lines that trip
# other checks (e.g. this file's own past runs), so keep it out of scope.
# app/assets/tailwind/poetry/ is vendored, regenerated by `bin/rails g
# poetry:install`, and full of Rouge syntax-token classes (.nd, .nf, .fm)
# that read as misspellings.
extend-exclude = ["*_output.txt", "app/assets/tailwind/poetry/*"]

[default.extend-words]
# Deliberate partial-word test data in transcript_recorder_test.rb
# (streamed delta chunks of "hello"), not a misspelling.
hel = "hel"
